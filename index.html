<!--entry point for Vite app-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Try On Quiz — Find your perfect running shoe</title>
    <!--Google Font never used!-->
    <!--open early connections to google font api, saving one round trip before real request fires-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--single api request for both fonts, also fallback font-->
    <!--response is a small css file-->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--single mount point, DOM node Vue attaches to-->
    <div id="app"></div>
    <!--Vite reads script, follows graph starting from main.ts-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
